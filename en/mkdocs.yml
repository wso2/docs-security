# Project information
site_name: WSO2 Security and Compliance Documentation
site_description: WSO2 security advisories, CVE justifications, cloud security bulletins, secure coding and deployment guidelines, and how to report a vulnerability.
site_author: WSO2
site_url: https://security.docs.wso2.com/en/latest/

# Repository
repo_name: wso2/docs-security
repo_url: https://github.com/wso2/docs-security
edit_uri: https://github.com/wso2/docs-security/edit/main/en/docs/

# Copyright
copyright: WSO2 Security and Compliance - Documentation

# Configuration
theme:
  name: material
  custom_dir: theme/material
  # Dark-coloured logo for the light theme; white logo for the dark theme.
  logo: assets/images/logo-for-light.svg
  logo_light: assets/images/logo-for-dark.svg
  favicon: assets/images/favicon.png
  language: 'en'
  font: false
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: assets/libs/oxygen-ui-icons/1.7.3/crescent-bright-16.svg
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: assets/libs/oxygen-ui-icons/1.7.3/sun-16.svg
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant.progress
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - search.suggest
    - search.share

# Breaks build if there's a warning
strict: false

validation:
  absolute_links: ignore
  unrecognized_links: ignore


# Extensions
markdown_extensions:
  - admonition
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.meta
  - markdown.extensions.toc:
      permalink: true
      toc_depth: 3
  - markdown_include.include:
      base_path: docs
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: docs
  - attr_list

# Build hooks
hooks:
  - hooks/seo.py

# Plugin
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - markdownextradata:
      jinja_options:
        variable_start_string: '{{#'
        variable_end_string: '#}}'
  - redirects:
      redirect_maps:
        # Asgardeo cloud bulletins rebranded to WSO2 Identity Platform
        'security-announcements/cloud-security-bulletins/asgardeo/index.md': 'security-announcements/cloud-security-bulletins/wso2-identity-platform/index.md'
        'security-announcements/cloud-security-bulletins/asgardeo/2025/index.md': 'security-announcements/cloud-security-bulletins/wso2-identity-platform/2025/index.md'
        'security-announcements/cloud-security-bulletins/asgardeo/2025/asgardeo-2025-h1.md': 'security-announcements/cloud-security-bulletins/wso2-identity-platform/2025/wso2-identity-platform-2025-h1.md'
        'security-announcements/cloud-security-bulletins/asgardeo/2025/asgardeo-2025-h2.md': 'security-announcements/cloud-security-bulletins/wso2-identity-platform/2025/wso2-identity-platform-2025-h2.md'
        # CVE-2024-0392 reassigned to WSO2-2023-2987
        'security-announcements/security-advisories/2024/CVE-2024-0392.md': 'security-announcements/security-advisories/2024/WSO2-2023-2987.md'
        # CVE-to-WSO2 advisory mapping retired; each advisory shows its CVE IDs
        'security-announcements/cve-to-wso2-security-advisory-mapping.md': 'security-announcements/security-advisories/index.md'
        # CVE-2010-4208 superseded by CVE-2013-6780 in-depth analysis
        'security-announcements/cve-justifications/2025/CVE-2010-4208.md': 'security-announcements/cve-justifications/2025/CVE-2013-6780.md'
        # Published CVE records reference these advisories under the wrong year folder
        'security-announcements/security-advisories/2025/WSO2-2024-3566.md': 'security-announcements/security-advisories/2024/WSO2-2024-3566.md'
        'security-announcements/security-advisories/2026/WSO2-2024-3144.md': 'security-announcements/security-advisories/2025/WSO2-2024-3144.md'
        # public-artifacts section retired; point to docs root
        'public-artifacts/index.md': 'index.md'
        # security-processes hub retired; sub-pages remain reachable from nav and home cards
        'security-processes/index.md': 'index.md'
        # security-guidelines top-level hub retired; sub-sections remain reachable
        'security-guidelines/index.md': 'index.md'
        # security-announcements top-level hub retired; sub-sections remain reachable and are linked from wso2.com/security
        'security-announcements/index.md': 'index.md'
        # Secure-coding guide history: original stack-split to a unified guide with content tabs
        'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/general-recommendations-for-secure-coding.md': 'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/secure-coding-guide.md'
        'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/principles.md': 'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/secure-coding-guide.md'
        'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/java-stack.md': 'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/secure-coding-guide.md'
        'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/go-stack.md': 'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/secure-coding-guide.md'
        'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/owasp-t10-2017-prevention.md': 'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/owasp-t10-2025-prevention.md'
        'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/owasp-t10-2013-prevention.md': 'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/owasp-t10-2025-prevention.md'
        'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/owasp-mobile-t10-prevention.md': 'security-guidelines/secure-engineering-guidelines/secure-coding-guidlines/owasp-t10-2025-prevention.md'
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - skip-lightbox
      auto_caption: false
      caption_position: bottom
  - include-markdown
  - exclude:
      glob:
        - wip/*

# Extra
extra_css:
  # Listed separately so browsers fetch them in parallel; an @import chain
  # in theme.css delays the first render.
  - assets/css/partials/_typography.css
  - assets/css/partials/_button.css
  - assets/css/partials/_icon.css
  - assets/css/partials/_search.css
  - assets/css/partials/_card.css
  - assets/css/partials/_footer.css
  - assets/css/partials/_sidebar.css
  - assets/css/partials/_header.css
  - assets/css/theme.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wso2
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/wso2
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/wso2
  site_version: 1.0.0
  cp_timeframe: 2015-2026
  # Root-relative so links resolve under both prod (security.docs.wso2.com/en/latest/)
  # and the local dev server, which mkdocs serves under /en/latest/ because of site_url.
  base_path: '/en/latest'
  nav_list:
    - Home
    - Security Processes
    - Security Guidelines
    - Security Announcements
    - Security Reporting

  nav_icons:
    Home:
      icon: octicons/home-16
      level: 1
    Security Processes:
      icon: octicons/workflow-16
      level: 1
    Security Guidelines:
      icon: octicons/book-16
      level: 1
    Security Reporting:
      icon: octicons/megaphone-16
      level: 1
    Security Announcements:
      icon: octicons/shield-check-16
      level: 1

  expanded_navs:
    - title: Security Processes
      options:
        - verticle-line
    - title: Security Guidelines
      options:
        - verticle-line
        - divider
    - title: Security Reporting
      options:
        - verticle-line
    - title: Security Announcements
      options:
        - verticle-line
        - divider

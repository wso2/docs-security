name: PR Builder

on:
  pull_request:
    paths:
      - 'en/**'
      - '.github/workflows/pr-builder.yml'
      - '.github/scripts/check_internal_links.py'
      - '.github/scripts/check_built_pages.py'

concurrency:
  group: pr-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Python 3.8 (the WSO2 docs builder version) is not available on ubuntu-latest (24.04) runners.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: en/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r en/requirements.txt

      - name: Build docs
        working-directory: en
        run: mkdocs build

      # The live site answers missing URLs with a 200 "page not found" page, so
      # broken links have to be caught in the build output.
      - name: Check internal links
        run: python .github/scripts/check_internal_links.py en/site

      # Search engines index the menu on every page. Keep it to the open section
      # and out of search result snippets.
      - name: Check built pages
        run: python .github/scripts/check_built_pages.py en/site

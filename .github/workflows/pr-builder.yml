name: PR Builder

# No paths filter: a required check that is skipped by a filter stays pending
# and blocks the merge.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The check's name in branch protection. A distinct name keeps another job called
    # "build" from satisfying the required check.
    name: Build the site
    # Python 3.8 (the WSO2 docs builder version) is not available on ubuntu-latest (24.04) runners.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: en/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r en/requirements.txt

      - name: Build docs
        working-directory: en
        run: mkdocs build

      # The live site answers missing URLs with a 200 "page not found" page, so
      # broken links have to be caught in the build output.
      - name: Check internal links
        run: python .github/scripts/check_internal_links.py en/site

      # Search engines index the menu on every page. Keep it to the open section
      # and out of search result snippets.
      - name: Check built pages
        run: python .github/scripts/check_built_pages.py en/site

      # Other sites and CVE records link to these pages. Build the base branch too,
      # and fail when a URL it publishes is missing from this build. A moved or
      # removed page needs a redirect.
      - name: Check for removed URLs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/base/en" && mkdocs build --site-dir "$RUNNER_TEMP/base-site")
          python .github/scripts/check_removed_urls.py "$RUNNER_TEMP/base-site" en/site

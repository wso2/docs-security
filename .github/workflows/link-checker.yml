name: Broken Link Checker

# Every day, check the links of the live site. When the live site has broken
# links, the run fails and opens an issue (or comments on the open one); the next
# passing run closes it. A manual run of another URL only fails and uploads the
# report.
on:
  workflow_dispatch:
    inputs:
      siteUrl:
        description: 'Site URL to check'
        default: 'https://security.docs.wso2.com/en/latest/'
        required: true
  schedule:
    - cron: '30 2 * * *'  # daily at 02:30 UTC

permissions:
  contents: read

env:
  DEFAULT_URL: 'https://security.docs.wso2.com/en/latest/'

jobs:
  linkchecker:
    # Scheduled runs are for the WSO2 repository, not its forks.
    if: github.event_name != 'schedule' || github.repository == 'wso2/docs-security'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install linkchecker
        run: pip install linkchecker==10.6.0

      - name: Run link checker
        id: check
        shell: bash
        env:
          SITE_URL: ${{ inputs.siteUrl || env.DEFAULT_URL }}
        run: |
          report="$RUNNER_TEMP/linkchecker.txt"
          status=0
          linkchecker -F html "$SITE_URL" --threads=100 --no-warnings --no-status > "$report" 2>&1 || status=$?
          cat "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "failed=$([ "$status" -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linkchecker-report
          path: linkchecker-out.html
          if-no-files-found: ignore

      - name: Report to an issue
        if: always() && steps.check.outputs.failed != '' && (inputs.siteUrl || env.DEFAULT_URL) == env.DEFAULT_URL
        uses: ./.github/actions/report-issue
        with:
          title: Broken Link Checker found broken links
          failed: ${{ steps.check.outputs.failed }}
          report: ${{ steps.check.outputs.report }}

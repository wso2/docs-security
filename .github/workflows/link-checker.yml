name: Broken Link Checker

# Every week, build the site and check its links to other sites. The pages are
# read from the build, not the live site, so the check adds no traffic to the
# site or its analytics; links between the site's own pages are checked on every
# pull request (check_internal_links.py). When a link is broken, the run fails
# and opens an issue (or comments on the open one); the next passing run closes it.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'  # Mondays at 02:30 UTC

permissions:
  contents: read

concurrency:
  group: link-checker
  cancel-in-progress: true

jobs:
  linkchecker:
    # Scheduled runs are for the WSO2 repository, not its forks.
    if: github.event_name != 'schedule' || github.repository == 'wso2/docs-security'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # linkchecker needs Python 3.9 or later. The site builds the same on 3.12 as on 3.8.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: en/requirements.txt

      - name: Install dependencies
        run: pip install -r en/requirements.txt linkchecker==10.6.0

      - name: Build docs
        working-directory: en
        run: mkdocs build

      # The build is served on localhost at /en/latest/, its path on the live site,
      # because its pages link to /en/latest/... from the site root. The site's own
      # host is left out: an absolute link to one of its pages would request the
      # live site, and the build has the page.
      - name: Check links to other sites
        id: check
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/www/en"
          cp -R en/site "$RUNNER_TEMP/www/en/latest"
          python -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/www" > /dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/en/latest/ && break; sleep 1; done
          report="$RUNNER_TEMP/linkchecker.txt"
          status=0
          # .github/linkcheckerrc ignores every warning but a rate-limited link (HTTP 429),
          # which was not checked, so it fails the run and is listed in the report.
          linkchecker -f .github/linkcheckerrc http://127.0.0.1:8000/en/latest/ --check-extern \
            --ignore-url='^https?://security\.docs\.wso2\.com/' \
            --threads=10 --no-status -F html > "$report" 2>&1 || status=$?
          cat "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "failed=$([ "$status" -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linkchecker-report
          path: linkchecker-out.html
          if-no-files-found: ignore

      - name: Report to an issue
        # A step that fails before the check (dependencies, the build) reports too. Only
        # runs on main report, so a manual run on another branch cannot close the issue.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/report-issue
        with:
          title: Broken Link Checker found broken links
          failed: ${{ steps.check.outputs.failed || 'true' }}
          report: ${{ steps.check.outputs.report }}
